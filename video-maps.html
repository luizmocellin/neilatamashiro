/* ---------- utilidades ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const vis = (t, a, b, c, d) => eOut(lin(t, a, b)) * (1 - eIn(lin(t, c, d)));
const D2R = Math.PI / 180;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* PCHIP (cúbica monotônica): suave e sem overshoot; com dados crescentes,
   o azimute nunca para nem volta — a órbita é contínua. */
function pchip(xs, ys) {
  const n = xs.length, h = [], d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i]; }
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
  }
  return x => {
    if (x <= xs[0]) return ys[0] + m[0] * (x - xs[0]);
    if (x >= xs[n - 1]) return ys[n - 1] + m[n - 1] * (x - xs[n - 1]);
    let i = 0; while (x > xs[i + 1]) i++;
    const t = (x - xs[i]) / h[i], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h[i] * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h[i] * m[i + 1];
  };
}

const P = 74, ROAD = 14, N = 12;           // quadra 60 + rua 14
const S0 = new THREE.Vector2(2 * P, 3 * P);     // início (sua localização)
const C0 = new THREE.Vector2(2 * P, -2 * P);    // esquina: vire à esquerda
const E0 = new THREE.Vector2(-1.5 * P, -2 * P); // destino
const DEST = { x: -111, z: -125, w: 46, d: 28, h: 24, front: -139 };

// rota: Rua das Acácias (norte) → curva → Av. dos Ipês (oeste)
const route = (() => {
  const pts = [], R = 14, step = 2;
  for (let z = S0.y; z > C0.y + R; z -= step) pts.push(new THREE.Vector2(S0.x, z));
  const cx = C0.x - R, cz = C0.y + R;
  for (let k = 0; k <= 12; k++) { const a = -Math.PI / 2 * k / 12; pts.push(new THREE.Vector2(cx + R * Math.cos(a), cz + R * Math.sin(a))); }
  for (let x = C0.x - R - step; x >= E0.x; x -= step) pts.push(new THREE.Vector2(x, C0.y));
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + pts[i].distanceTo(pts[i - 1]));
  return { pts, len, L: len[len.length - 1], seg1: (S0.y - C0.y) - R + Math.PI * R / 4 };
})();
function routeAt(s) {
  s = cl(s, 0, route.L);
  let lo = 0, hi = route.len.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (route.len[mid] <= s) lo = mid; else hi = mid; }
  const k = (s - route.len[lo]) / Math.max(1e-6, route.len[hi] - route.len[lo]);
  const a = route.pts[lo], b = route.pts[hi];
  return { x: mix(a.x, b.x, k), z: mix(a.y, b.y, k), tx: b.x - a.x, tz: b.y - a.y };
}
function routeSmooth(s) {
  let x = 0, z = 0, n = 0;
  for (let k = -60; k <= 60; k += 10) { const p = routeAt(s + 8 + k); x += p.x; z += p.z; n++; }
  return { x: x / n, z: z / n };
}

function aoLambert(opts) {

    sh.vertexShader = 'varying float vAOy;\n' + sh.vertexShader.replace('#include <project_vertex>',

}

function ribbon(color, y, order) {
  const n = route.pts.length, pos = new Float32Array(n * 2 * 3), side = new Float32Array(n * 2), dir = new Float32Array(n * 2 * 2), len = new Float32Array(n * 2), idx = [];
  for (let i = 0; i < n; i++) {
    const a = route.pts[Math.max(0, i - 1)], b = route.pts[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x, tz = b.y - a.y; const l = Math.hypot(tx, tz); tx /= l; tz /= l;
    for (let s = 0; s < 2; s++) {
      const k = i * 2 + s;
      pos[k * 3] = route.pts[i].x; pos[k * 3 + 1] = y; pos[k * 3 + 2] = route.pts[i].y;
      side[k] = s ? 1 : -1; dir[k * 2] = -tz; dir[k * 2 + 1] = tx; len[k] = route.len[i];
    }
    if (i < n - 1) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSide', new THREE.BufferAttribute(side, 1));
  g.setAttribute('aDir', new THREE.BufferAttribute(dir, 2));
  g.setAttribute('aLen', new THREE.BufferAttribute(len, 1));
  g.setIndex(idx);
  const mat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uProg: { value: 0 }, uWidth: { value: 8 }, uColor: { value: new THREE.Color(color) } }]),
    fog: true, depthWrite: false,
    vertexShader: `
      attribute float aSide; attribute vec2 aDir; attribute float aLen;
      uniform float uWidth; varying float vLen; varying float vSide;
      #include <fog_pars_vertex>
      void main(){
        vec3 p = position + vec3(aDir.x, 0.0, aDir.y) * aSide * uWidth * 0.5;
        vLen = aLen; vSide = aSide;
        vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform float uProg; uniform vec3 uColor; varying float vLen; varying float vSide;
      #include <fog_pars_fragment>
      void main(){
        if (vLen > uProg) discard;
        gl_FragColor = vec4(uColor, 1.0);
        #include <fog_fragment>
      }`
  });
  const m = new THREE.Mesh(g, mat); m.frustumCulled = false; m.renderOrder = order; scene.add(m); return mat;
}

function updateWorld(t, jx = 0, jy = 0) {
  const c = camAt(t);
  camera.fov = c.fov; camera.updateProjectionMatrix();
  const el = c.elev * D2R, az = c.az * D2R, ce = Math.cos(el);
  camera.position.set(c.tx + c.dist * ce * Math.sin(az), c.ty + c.dist * Math.sin(el), c.tz + c.dist * ce * Math.cos(az));
  camera.lookAt(c.tx, c.ty, c.tz);
  camera.updateMatrixWorld();
  const e = camera.projectionMatrix.elements;
  e[8] = -(jx * 2 / RW); e[9] = -(c.shift + jy * 2 / RH);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

  scene.fog.near = c.dist * 0.5; scene.fog.far = c.dist * 2.4 + 360;

  // pin: tamanho quase constante na tela, como nos mapas
  const ps = Math.max(mix(10, 6.5, sm(lin(t, 12.2, 12.9)) * (1 - sm(lin(t, 14.8, 15.8)))), c.dist * 0.05);
  const b = lin(t, 0.98, 1.6), squash = 1 + 0.28 * Math.sin(b * Math.PI * 3) * (1 - b) * (b > 0 ? 1 : 0);
  pin.visible = t >= 0.96;
  pin.scale.set(ps / squash, ps * squash, ps / squash);
  pinBody.position.y = 0.06 * Math.sin(t * 4) * lin(t, 1.6, 2.2);
  _v.set(pin.position.x, pin.position.y + ps, pin.position.z); _v.subVectors(camera.position, _v).normalize();
  pinDot.position.set(_v.x * 0.33, 1.0 + _v.y * 0.33, _v.z * 0.33);

  // rota
  const pr = t < T_ROUTE0 ? -1 : routeProg(t);
  const rw = Math.max(7, c.dist * 0.014);
  routeInner.uniforms.uProg.value = pr; routeOuter.uniforms.uProg.value = pr;
  routeInner.uniforms.uWidth.value = rw; routeOuter.uniforms.uWidth.value = rw * 1.45;
  arrow.visible = t > T_ROUTE0 + 0.05 && t < 12.75;
  if (arrow.visible) {
    const h = routeAt(pr + 1);
    arrow.position.set(h.x, 0, h.z);
    arrow.rotation.y = Math.atan2(-h.tx, -h.tz);
    arrow.scale.setScalar(Math.max(5, c.dist * 0.022));
  }
  // ponto azul
  blueDot.visible = t > 4.1 && t < 13;
  blueDot.scale.setScalar(Math.max(3.2, c.dist * 0.0095));
  const ph = (t * 0.9) % 1; halo.scale.setScalar(1 + ph * 1.3); haloMat.opacity = 0.3 * (1 - ph);
  // rótulos sempre legíveis
  const fx = c.tx - camera.position.x, fz = c.tz - camera.position.z;
  labels.forEach(L => { const ux = -Math.sin(L.base), uz = -Math.cos(L.base); L.m.rotation.y = (ux * fx + uz * fz) < 0 ? L.base + Math.PI : L.base; });
  return c;
}

/* ---------- motion blur por acumulação ---------- */
const rtScene = new THREE.WebGLRenderTarget(RW, RH, { depthBuffer: true });
const accType = renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType;
const rtAcc = new THREE.WebGLRenderTarget(RW, RH, { type: accType, depthBuffer: false });
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const VQ = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const accMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: rtScene.texture }, uW: { value: 1 / SUB } },
  vertexShader: VQ,
  fragmentShader: `uniform sampler2D tSrc; uniform float uW; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tSrc, vUv).rgb; gl_FragColor = vec4(pow(c, vec3(2.2)) * uW, uW); }`,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  depthTest: false, depthWrite: false, transparent: true
});
const finMat = new THREE.ShaderMaterial({
  uniforms: { tAcc: { value: rtAcc.texture } },
  vertexShader: VQ,
  fragmentShader: `uniform sampler2D tAcc; varying vec2 vUv;
    void main(){ vec3 c = pow(max(texture2D(tAcc, vUv).rgb, 0.0), vec3(1.0/2.2));
      vec2 d = vUv - 0.5; c *= 1.0 - 0.18 * dot(d, d) * 2.0;
      gl_FragColor = vec4(c, 1.0); }`,
  depthTest: false, depthWrite: false
});
const accScene = new THREE.Scene(); accScene.add(new THREE.Mesh(quadGeo, accMat));
const finScene = new THREE.Scene(); finScene.add(new THREE.Mesh(quadGeo, finMat));
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }

function render3D(t) {
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0x000000, 0); renderer.clear(true, false, false);
  for (let i = 0; i < SUB; i++) {
    const ts = t + ((i + 0.5) / SUB - 0.5) * SHUTTER;      // instante do sub-quadro
    const jx = halton(i + 1, 2) - 0.5, jy = halton(i + 1, 3) - 0.5; // jitter sub-pixel (AA)
    updateWorld(Math.max(0, ts), SUB > 1 ? jx : 0, SUB > 1 ? jy : 0);
    renderer.setRenderTarget(rtScene); renderer.setClearColor(FOGC, 1); renderer.clear(true, true, false);
    renderer.render(scene, camera);
    renderer.setRenderTarget(rtAcc); renderer.render(accScene, quadCam);
  }
  renderer.setRenderTarget(null); renderer.render(finScene, quadCam);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(renderer.domElement, 0, 0, W, H);
}

const FONT = 'Roboto, Arial, sans-serif';
function font(size, weight = 400) { ctx.font = `${weight} ${size}px ${FONT}`; }
function text(s, x, y, size, weight, color, align = 'left') { font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else { r = Math.min(r, w / 2, h / 2); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); } }
function shadow(blur = 30, oy = 8, a = 0.22) { ctx.shadowColor = `rgba(0,0,0,${a})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }

function pin2D(x, tipY, h, color = '#EA4335') {
  const k = h / 1.42, cy = tipY - k, r = 0.42 * k, a = Math.asin(0.42);
  ctx.beginPath(); ctx.moveTo(x, tipY); ctx.arc(x, cy, r, a, Math.PI - a, true); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = Math.max(1, h * 0.025); ctx.strokeStyle = 'rgba(120,10,6,.45)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, cy, 0.17 * k, 0, Math.PI * 2); ctx.fillStyle = '#7d1410'; ctx.fill();
}
function star(x, y, r, fill) {

}

  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(20, -8); ctx.lineTo(-20, -8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-34, -16); ctx.lineTo(-8, -36); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();

  shadow(40, 14, 0.25); ctx.fillStyle = '#fff'; rr(cx - size / 2, cy - size / 2, size, size, size * 0.24); ctx.fill(); noShadow();

  ctx.fillStyle = '#7CC57F'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + s * 0.55, y0); ctx.lineTo(x0, y0 + s * 0.55); ctx.fill();
  ctx.fillStyle = '#7FB9F5'; ctx.beginPath(); ctx.moveTo(x0 + s, y0 + s * 0.45); ctx.lineTo(x0 + s, y0 + s); ctx.lineTo(x0 + s * 0.45, y0 + s); ctx.fill();

    text('Fachada Digital · à esquerda', 252, y + 216, 40, 400, 'rgba(255,255,255,.9)');
    ctx.restore();
    const cb = vis(t, 13.05, 13.45, 14.75, 15.1);
    const yb = mix(H + 20, 1500, cb);
    shadow(40, 8, 0.25); ctx.fillStyle = '#fff'; rr(40, yb, 1000, 330, 44); ctx.fill(); noShadow();
    ctx.save(); rr(76, yb + 36, 258, 258, 30); ctx.clip(); ctx.fillStyle = BRAND.bg; ctx.fillRect(76, yb + 36, 258, 258); logoCrop(FULL_CROP, 92, yb + 60, 226); ctx.restore();
    text('Fachada Digital', 370, yb + 110, 56, 700, '#202124');
    text('4,9', 370, yb + 178, 40, 500, '#3c4043'); stars(450, yb + 165, 16); text('(218)', 668, yb + 178, 38, 400, '#70757a');
    text('Aberto agora', 370, yb + 240, 38, 700, '#188038');
  }

  /* --- câmera sobe: frases (15,2–17,6) --- */
  const tg1 = vis(t, 15.2, 15.6, 17.35, 17.7), tg2 = vis(t, 15.85, 16.25, 17.35, 17.7);
  if (tg1 > 0 || tg2 > 0) {
    ctx.save(); ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = 40;
    ctx.globalAlpha = tg1; text('Seu cliente procura…', 540, 360 - (1 - tg1) * 40, 84, 900, BRAND.dark, 'center');
    ctx.globalAlpha = tg2; text('…e chega até você.', 540, 470 - (1 - tg2) * 40, 84, 900, BRAND.rust, 'center');
    ctx.restore();
  }

  /* --- cartão final (17,7–21) --- */
  const fc = eOut(lin(t, 17.7, 18.25));
  if (fc > 0) {
    ctx.fillStyle = `rgba(43,32,26,${0.35 * fc})`; ctx.fillRect(0, 0, W, H);
    const y = mix(H + 40, 300, fc);
    shadow(60, 20, 0.35); ctx.fillStyle = BRAND.bg; rr(56, y, 968, 1440, 56); ctx.fill(); noShadow();
    const lp = eBack(lin(t, 17.95, 18.45));
    if (lp > 0) { ctx.save(); ctx.translate(540, y + 300); ctx.scale(lp, lp); logoCrop(FULL_CROP, -310, -264, 620); ctx.restore(); }
    const a1 = eOut(lin(t, 18.3, 18.7)), a2 = eOut(lin(t, 18.55, 18.95));
    ctx.save(); ctx.globalAlpha = a1;
    ctx.fillStyle = BRAND.dark; ctx.fillRect(140, y + 640 - 3, 800 * a1, 6);
    text('Gestão de Google Maps', 540, y + 760 + (1 - a1) * 30, 76, 900, BRAND.dark, 'center');
    text('para negócios locais', 540, y + 840 + (1 - a1) * 30, 54, 500, BRAND.rust, 'center');
    ctx.restore();
    ['Perfil otimizado e verificado', 'Mais avaliações e fotos', 'Clientes chegando na sua porta'].forEach((s, k) => {
      const a = eOut(lin(t, 18.75 + k * 0.18, 19.15 + k * 0.18)); if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; const yy = y + 960 + k * 92, xx = 150 + (1 - a) * -40;
      ctx.fillStyle = BRAND.rust; ctx.beginPath(); ctx.arc(xx + 26, yy - 14, 28, 0, 7); ctx.fill(); check(xx + 26, yy - 14, 1.1, '#fff');
      text(s, xx + 80, yy, 44, 500, BRAND.dark); ctx.restore();
    });
    const cta = eBack(lin(t, 19.4, 19.85));
    if (cta > 0) {
      const pulse = 1 + 0.03 * Math.sin((t - 19.85) * Math.PI * 4) * lin(t, 19.85, 20.1);
      ctx.save(); ctx.translate(540, y + 1330); ctx.scale(cta * pulse, cta * pulse);
      shadow(30, 10, 0.3); ctx.fillStyle = BRAND.rust; rr(-380, -64, 760, 128, 64); ctx.fill(); noShadow();
      text('Quero aparecer no Maps', 0, 18, 50, 700, '#fff', 'center'); ctx.restore();
    }
  }
  // fade final
  const fo = lin(t, 20.6, 21);
  if (fo > 0) { ctx.fillStyle = `rgba(20,16,14,${fo * 0.0})`; ctx.fillRect(0, 0, W, H); }
}

function pinScreen(t) {
  updateWorld(t);
  const ps = Math.max(10, camAt(t).dist * 0.05); // só usado na abertura
  const tipV = new THREE.Vector3(DEST.x, DEST.h, DEST.z).project(camera);
  const topV = new THREE.Vector3(DEST.x, DEST.h + ps * 1.42, DEST.z).project(camera);
  const x = (tipV.x * 0.5 + 0.5) * W, tip = (-tipV.y * 0.5 + 0.5) * H, top = (-topV.y * 0.5 + 0.5) * H;
  return { x, tip, h: Math.max(20, tip - top) };
}

function frame(t) {
  render3D(t);
  drawUI(t, t < 1.3 ? pinScreen(t) : null);
}

/* =====================================================================
   Trilha — 120 BPM, Web Audio (sintetizada, nada externo)
   ===================================================================== */
function buildAudio(ac, dests) {
  const T = ac.currentTime + 0.08;
  const outG = ac.createGain(); outG.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.18;
  outG.connect(comp); dests.forEach(d => comp.connect(d));
  outG.gain.setValueAtTime(0.9, T + 20.2); outG.gain.linearRampToValueAtTime(0.0001, T + 21);

  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0);
  const r = rng(7); for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;
  const noise = (t, dur) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; s.start(T + t, r() * 1.5); s.stop(T + t + dur + 0.05); return s; };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, T + t); g.gain.exponentialRampToValueAtTime(peak, T + t + a); g.gain.exponentialRampToValueAtTime(0.0001, T + t + a + d); };

  const drums = ac.createGain(); drums.gain.value = 0.9; drums.connect(outG);
  const music = ac.createGain(); music.gain.value = 1; music.connect(outG);
  const pad = ac.createGain(); pad.gain.value = 0.55; pad.connect(music);

  function kick(t, amp = 1) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(160, T + t); o.frequency.exponentialRampToValueAtTime(42, T + t + 0.13);
    env(g, t, 0.003, 0.9 * amp, 0.32); o.connect(g); g.connect(drums); o.start(T + t); o.stop(T + t + 0.4);
    pad.gain.setValueAtTime(0.18, T + t + 0.01); pad.gain.linearRampToValueAtTime(0.55, T + t + 0.28); // sidechain
  }
  function hat(t, amp = 1) {
    const s = noise(t, 0.06), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'highpass'; f.frequency.value = 7500; env(g, t, 0.002, 0.16 * amp, 0.05);
    s.connect(f); f.connect(g); g.connect(drums);
  }
  function clap(t) {
    const s = noise(t, 0.25), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, T + t);
    [0, 0.012, 0.024].forEach(o => { g.gain.setValueAtTime(0.35, T + t + o); g.gain.exponentialRampToValueAtTime(0.05, T + t + o + 0.01); });
    g.gain.setValueAtTime(0.3, T + t + 0.035); g.gain.exponentialRampToValueAtTime(0.0001, T + t + 0.2);
    s.connect(f); f.connect(g); g.connect(drums);
  }
  function bass(t, m, dur) {
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = mtof(m);
    f.type = 'lowpass'; f.Q.value = 6; f.frequency.setValueAtTime(900, T + t); f.frequency.exponentialRampToValueAtTime(160, T + t + dur);
    env(g, t, 0.005, 0.22, dur); o.connect(f); f.connect(g); g.connect(music); o.start(T + t); o.stop(T + t + dur + 0.05);
  }
  function padChord(t, notes, dur, amp = 0.05) {
    const f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 1500; f.Q.value = 0.5;
    g.gain.setValueAtTime(0.0001, T + t); g.gain.linearRampToValueAtTime(amp, T + t + 0.25);
    g.gain.setValueAtTime(amp, T + t + dur - 0.15); g.gain.linearRampToValueAtTime(0.0001, T + t + dur + 0.1);
    f.connect(g); g.connect(pad);
    notes.forEach(m => [-7, 7].forEach(dt => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = dt; o.connect(f); o.start(T + t); o.stop(T + t + dur + 0.2); }));
  }
  function pluck(t, m, amp = 0.07) {
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    o.type = 'triangle'; o.frequency.value = mtof(m); env(g, t, 0.003, amp, 0.2);
    o.connect(g); if (p) { p.pan.value = Math.sin(t * 3) * 0.5; g.connect(p); p.connect(music); } else g.connect(music);
    o.start(T + t); o.stop(T + t + 0.3);
  }
  function whoosh(t, dur = 0.8, amp = 0.5, f0 = 250, f1 = 2800) {
    const s = noise(t, dur), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.Q.value = 0.9;
    f.frequency.setValueAtTime(f0, T + t); f.frequency.exponentialRampToValueAtTime(f1, T + t + dur * 0.6); f.frequency.exponentialRampToValueAtTime(f0 * 0.8, T + t + dur);
    g.gain.setValueAtTime(0.0001, T + t); g.gain.exponentialRampToValueAtTime(amp, T + t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, T + t + dur);
    s.connect(f); f.connect(g);
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.setValueAtTime(-0.8, T + t); p.pan.linearRampToValueAtTime(0.8, T + t + dur); g.connect(p); p.connect(outG); } else g.connect(outG);
  }
  function blip(t, f0, f1, dur, amp, type = 'sine') {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, T + t); o.frequency.exponentialRampToValueAtTime(f1, T + t + dur);
    env(g, t, 0.004, amp, dur); o.connect(g); g.connect(outG); o.start(T + t); o.stop(T + t + dur + 0.05);
  }
  function tap(t) { blip(t, 2200, 1400, 0.05, 0.12); const s = noise(t, 0.03), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'highpass'; f.frequency.value = 4000; env(g, t, 0.001, 0.15, 0.025); s.connect(f); f.connect(g); g.connect(outG); }
  function bell(t, m, amp = 0.2) { [1, 2.01, 3.0].forEach((h, k) => blip(t, mtof(m) * h, mtof(m) * h * 0.999, 1.4 / (k + 1), amp / (k + 1))); }
  function riser(t, dur) {
    const s = noise(t, dur), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(400, T + t); f.frequency.exponentialRampToValueAtTime(7000, T + t + dur);
    g.gain.setValueAtTime(0.0001, T + t); g.gain.exponentialRampToValueAtTime(0.3, T + t + dur); g.gain.linearRampToValueAtTime(0.0001, T + t + dur + 0.04);
    s.connect(f); f.connect(g); g.connect(outG);
  }
  function impact(t) {
    kick(t, 1.2); blip(t, 90, 30, 1.2, 0.5);
    const s = noise(t, 1.6), f = ac.createBiquadFilter(), g = ac.createGain(); f.type = 'highpass'; f.frequency.value = 4500;
    env(g, t, 0.005, 0.22, 1.5); s.connect(f); f.connect(g); g.connect(outG);
  }

  // progressão: Am – F – C – G (1 compasso = 2 s a 120 BPM)
  const prog = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]], roots = [45, 41, 36, 43];
  for (let bar = 0; bar < 11; bar++) {
    const t0 = bar * 2, c = bar % 4;
    padChord(t0, prog[c], 2, bar === 0 ? 0.035 : 0.05);
    for (let e = 0; e < 4; e++) { // batidas
      const tb = t0 + e * 0.5;
      if (tb >= 1.0 && tb < 17.5) { kick(tb); hat(tb + 0.25); if (e % 2 === 1 && tb >= 5.5) clap(tb); }
      if (tb >= 17.7 && tb < 20.5 && e % 2 === 0) kick(tb + 0.0, 0.6);
    }
    for (let e = 0; e < 8; e++) { // colcheias
      const te = t0 + e * 0.25;
      if (te >= 1.0 && te < 17.6) bass(te + 0.25 * 0 + (e % 2 ? 0 : 0), roots[c] + (e % 4 === 3 ? 12 : 0), 0.22);
      if (te >= 2.0 && te < 21) { const ch = prog[c]; pluck(te, ch[(e * 2) % 3] + 12 + (e % 4 === 2 ? 12 : 0), te > 17.7 ? 0.05 : 0.065); }
      if (te >= 9.0 && te < 17.5 && e % 2 === 1) hat(te + 0.125, 0.5);
    }
  }
  // efeitos sincronizados com as cenas
  blip(0.02, 300, 900, 0.18, 0.18);           // ícone aparece
  blip(0.5, 500, 1300, 0.12, 0.15);           // vira pin
  whoosh(0.75, 0.9, 0.6, 200, 3200);          // mergulho
  blip(1.12, 880, 440, 0.15, 0.2, 'triangle'); // pin pousa
  whoosh(2.65, 0.7, 0.35);                    // card
  blip(2.95, 700, 1400, 0.08, 0.14);
  tap(3.86);                                  // "Como chegar"
  whoosh(4.0, 0.8, 0.45, 220, 2400);          // visão geral
  tap(5.22);                                  // "Iniciar"
  whoosh(5.15, 0.9, 0.45, 300, 3600);         // rota começa
  blip(5.62, 660, 990, 0.1, 0.12);
  { const sw = T_ROUTE0 + (T_ROUTE1 - T_ROUTE0) * 0.48; blip(sw, 990, 1320, 0.1, 0.12); whoosh(sw - 0.3, 0.6, 0.25, 400, 2000); }
  whoosh(12.35, 0.85, 0.5, 200, 3000);        // fachada
  bell(12.85, 88, 0.2); bell(13.0, 95, 0.16); // "Você chegou!"
  whoosh(14.75, 1.1, 0.5, 150, 2600);         // câmera sobe
  riser(16.2, 1.5);
  whoosh(17.35, 0.6, 0.4, 300, 4000);
  impact(17.7);                               // cartão final
  bell(19.45, 84, 0.12);                      // CTA
  return { outG, T };
}

/* =====================================================================
   Reprodução, gravação, loop
   ===================================================================== */
const big = document.getElementById('big'), btnPlay = document.getElementById('btnPlay'), btnRec = document.getElementById('btnRec'), info = document.getElementById('info');
let ac = null, graph = null, playing = false, curT = 0.32, recorder = null, chunks = [], dirty = true;

async function start(record) {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  if (graph) { try { graph.outG.disconnect(); } catch (e) { } }
  const dests = [ac.destination];
  let md = null;
  if (record) { md = ac.createMediaStreamDestination(); dests.push(md); }
  graph = buildAudio(ac, dests);
  playing = true; big.hidden = true; btnPlay.textContent = '↺ Reiniciar';
  if (record) {
    const vs = out.captureStream(FPS);
    const stream = new MediaStream([...vs.getVideoTracks(), ...md.stream.getAudioTracks()]);
    const types = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const mime = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
    chunks = []; recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const type = recorder.mimeType || 'video/webm', ext = type.includes('mp4') ? 'mp4' : 'webm';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type })); a.download = `fachada-digital-maps.${ext}`; a.click();
      btnRec.disabled = false; btnRec.textContent = '● Gravar vídeo'; recorder = null;
    };
    recorder.start(); btnRec.disabled = true; btnRec.textContent = '● Gravando…';
  }
}
function finish() {
  playing = false; curT = DUR; big.hidden = false; big.textContent = '↺'; big.style.paddingLeft = '0';
  if (recorder && recorder.state !== 'inactive') setTimeout(() => recorder.stop(), 150);
}
big.onclick = () => start(false);
btnPlay.onclick = () => start(false);
btnRec.onclick = () => start(true);
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); start(false); } });

function loop() {
  requestAnimationFrame(loop);
  if (playing) {
    curT = Math.max(0, ac.currentTime - graph.T);
    if (curT >= DUR) { curT = DUR; finish(); }
    dirty = true;
  }
  if (!dirty) return;
  dirty = false;
  frame(Math.min(curT, DUR - 1e-3));
  info.textContent = `${curT.toFixed(1).replace('.', ',')} s / 21,0 s`;
}

(async function init() {
  try { await Promise.race([document.fonts.load('700 40px Roboto'), new Promise(r => setTimeout(r, 2500))]); await document.fonts.ready; } catch (e) { }
  await logoReady;
  buildDestination();
  makeLabel('Rua das Acácias', 2 * P, 70, 'z');
  makeLabel('Rua das Acácias', 2 * P, -330, 'z');
  makeLabel('Av. dos Ipês', 40, -2 * P, 'x');
  makeLabel('Av. dos Ipês', -260, -2 * P, 'x');
  makeLabel('Av. Central', -40, 2 * P, 'x');
  makeLabel('Rua Aurora', -2 * P, 0, 'z');
  makeLabel('Rua do Comércio', -40, 0, 'x');
  makeLabel('Rua das Flores', 0, -260, 'z');
  makeLabel('Rua Bela Vista', 260, -4 * P, 'x');
  if (FREEZE !== null) {
    frame(cl(FREEZE, 0, DUR - 1e-3)); big.hidden = true; window.__ready = true; return;
  }
  window.__ready = true;
  loop();
})();
